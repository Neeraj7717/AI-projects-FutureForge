services:
  via-api:
    build: .
    image: eizen-via-api_{{BUILD_NUMBER}}
    container_name: eizen-via-api
    restart: unless-stopped
    #ports:
    #  - "8079:8079"
    network_mode: host
    env_file:
      - ./env-config/eizen-via-api.txt
    volumes:
      - "{DATA_PATH}:/usr/app/checkpoints"