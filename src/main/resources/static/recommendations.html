<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recommendations — Cart Compass</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">
    <nav class="topnav">
      <div class="brand"><span class="brand-mark">CC</span> Cart Compass</div>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
      </div>
      <div class="db-indicator"><span class="dot" id="db-dot"></span><span id="db-label">Connecting…</span></div>
    </nav>

    <div class="body-row">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <div class="banner hidden" id="db-banner"></div>

      <div class="hero-banner compact">
        <h1>Recommendation explorer</h1>
        <p>Pick a product to see its full <strong>extended recommendation list</strong> — ranked by degrees of separation through the co-purchase graph, not just direct "bought together" counts.</p>
        <div class="search-box" style="max-width:480px">
          <input id="search-input" type="text" placeholder="Search a product…" autocomplete="off" />
          <div class="search-results" id="search-results"></div>
        </div>
      </div>

      <div class="section" id="result-section" style="display:none;margin-top:24px">
        <div id="result-body"></div>
      </div>
    </main>
    </div>

    <footer>Cart Compass — built on CognoDB (openCypher over Bolt)</footer>
  </div>

  <script src="js/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);

    initProductSearch(document.getElementById("search-input"), document.getElementById("search-results"), (id) => {
      document.getElementById("search-results").classList.remove("open");
      showRecommendations(id);
    });

    async function showRecommendations(productId) {
      const section = document.getElementById("result-section");
      const body = document.getElementById("result-body");
      section.style.display = "block";
      body.innerHTML = `<div class="loading-state"><div class="spinner"></div></div>`;
      section.scrollIntoView({ behavior: "smooth", block: "start" });

      try {
        const [product, result] = await Promise.all([
          Api.get(`/api/products/${encodeURIComponent(productId)}`),
          Api.get(`/api/recommendations/${encodeURIComponent(productId)}/extended?hops=4&limit=50`),
        ]);
        document.getElementById("search-input").value = product.name;

        const direct = result.recommendations.filter(r => r.hops === 1);
        const extended = result.recommendations.filter(r => r.hops > 1);

        if (!result.recommendations.length) {
          body.innerHTML = `<div class="empty-state"><div class="icon">🛒</div><div class="title">No recommendations yet</div><div class="hint">${escapeHtml(product.name)} hasn't been ordered alongside anything else.</div></div>`;
          return;
        }

        body.innerHTML = `
          <div class="card" style="padding:18px 20px;margin-bottom:16px">
            <strong>${escapeHtml(product.name)}</strong>
            <span style="color:var(--text-dim)"> · ${categoryBadge(product.category)} · ${formatPrice(product.price)}</span>
          </div>

          <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
            <div class="stat-card"><div class="value">${direct.length}</div><div class="label">Bought directly together</div></div>
            <div class="stat-card"><div class="value">${extended.length}</div><div class="label">Extended (2+ hops)</div></div>
            <div class="stat-card"><div class="value">${result.recommendations.length}</div><div class="label">Total recommendations</div></div>
          </div>

          <div class="card">
            <table>
              <thead><tr><th>Product</th><th>Category</th><th>Brand</th><th style="text-align:right">Price</th><th style="text-align:right">Degrees away</th></tr></thead>
              <tbody>
                ${result.recommendations.map(r => `
                  <tr class="clickable" onclick="location.href='${productUrl(r.productId)}'">
                    <td><div class="table-product-cell">${productThumb(r.productName, r.category, 32)}<strong>${escapeHtml(r.productName)}</strong></div></td>
                    <td>${categoryBadge(r.category)}</td>
                    <td style="color:var(--text-dim)">${escapeHtml(r.brand || "")}</td>
                    <td style="text-align:right" class="mono">${formatPrice(r.price)}</td>
                    <td style="text-align:right">${r.hops === 1 ? '<span class="badge clean">direct</span>' : `<span class="mono">${r.hops} hops</span>`}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
      } catch (e) {
        body.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div class="title">Couldn't load recommendations</div><div class="hint">${escapeHtml(e.message)}</div></div>`;
      }
    }

    const preselect = params.get("product");
    if (preselect) showRecommendations(preselect);
  </script>
</body>
</html>
