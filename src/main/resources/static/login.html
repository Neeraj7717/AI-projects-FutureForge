<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Cart Compass</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--bg); }
    .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-stack { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
    .login-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 22px; font-weight: 800; font-size: 21px; color: var(--text);
    }
    .login-logo .brand-mark { width: 34px; height: 34px; font-size: 15px; }
    .login-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 30px 28px;
      box-shadow: 0 1px 3px rgba(17,24,39,0.06), 0 8px 24px rgba(17,24,39,0.06);
    }
    .login-card h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; text-align: left; letter-spacing: -0.01em; }
    .login-card p.sub { text-align: left; color: var(--text-dim); font-size: 13.5px; margin: 0 0 26px; line-height: 1.5; }
    .login-field { margin-bottom: 18px; }
    .login-field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
    .login-field input {
      width: 100%; padding: 12px 14px; font-size: 15px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .login-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .login-error {
      display: none; align-items: center; gap: 8px;
      background: var(--red-soft); border: 1px solid rgba(220,38,38,0.3); color: var(--red);
      padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 18px;
    }
    .login-submit {
      width: 100%; justify-content: center; padding: 13px; font-size: 15px; font-weight: 700;
      border-radius: 24px; margin-top: 6px;
    }
    .login-footer-note {
      text-align: center; font-size: 12.5px; color: var(--text-dim); margin-top: 20px;
      padding-top: 18px; border-top: 1px solid var(--border-soft);
    }
    .login-hint { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-stack">
      <div class="login-logo"><span class="brand-mark">CC</span> Cart Compass</div>
      <div class="login-card">
        <h1>Sign in</h1>
        <p class="sub">Enter your username and password to continue to Cart Compass.</p>

        <div class="login-error" id="login-error"></div>

        <form id="login-form">
          <div class="login-field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus />
          </div>
          <div class="login-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn primary login-submit" id="login-submit">Sign in</button>
        </form>

        <p class="login-footer-note">This demo is behind a login — use the credentials you were given.</p>
      </div>
      <p class="login-hint">Cart Compass — built on CognoDB (openCypher over Bolt)</p>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    // Already signed in? Skip straight past the login screen.
    Api.get("/api/auth/status").then((s) => {
      if (s.authenticated) redirectAfterLogin();
    }).catch(() => { /* ignore - just show the form */ });

    function redirectAfterLogin() {
      const next = new URLSearchParams(location.search).get("next");
      location.href = next && next.startsWith("/") === false && !next.includes("://") ? next : "index.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.message || "Incorrect username or password.");
        }
        redirectAfterLogin();
      } catch (err) {
        errorBox.textContent = "⚠️ " + err.message;
        errorBox.style.display = "flex";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
