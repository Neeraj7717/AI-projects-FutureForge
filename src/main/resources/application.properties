# Kafka configuration
kafka.bootstrap-servers=localhost:9092
kafka.consumer.group-id=meta_data_update
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.name=update_meta_data
spring.cloud.stream.function.autodetect=false

# Unity Catalog configuration
unity.catalog.api.url=http://localhost:8080/api/2.1/unity-catalog
unity.catalog.api.token= # Leave empty if no auth is needed, or set to your-actual-token
unity.catalog.name=aialabs
unity.catalog.schema.name=dg_dev
unity.catalog.table.name=data_table
unity.catalog.table.fullname=aialabs_dg_dev.data_table

kafka.output.topic.name=get_lables
kafka.tables.topic=tables-topic
kafka.volumes.topic=volumes-topic

unity.storage.bucket=s3://your-bucket/path/to-table

spring.cloud.stream.bindings.metaDataUpdate-in-0.destination=meta_data_update
spring.cloud.stream.bindings.metaDataUpdate-in-0.group=config-consumer-group

# Logging settings
logging.level.jdk.internal.httpclient.debug=INFO
logging.level.org.aialabs.dg.broker=DEBUG
eureka.client.enabled=false