# AI Mock Interviewer Configuration
# ======================================

# AI Provider Configuration
# Available providers: openai, gemini, anthropic
# ai.provider=openai

ai.provider=gemini


# AI Model Configuration
# OpenAI models: gpt-4, gpt-4-turbo, gpt-3.5-turbo
# Gemini models: gemini-2.0-flash, gemini-1.5-pro, gemini-1.5-flash, gemini-1.0-pro
# Anthropic models: claude-3-opus, claude-3-sonnet, claude-3-haiku
# ai.model=gpt-4
ai.model=gemini-2.0-flash


# API Keys
# Replace with your actual API keys
openai.api.key=
gemini.api.key=
anthropic.api.key=

# Interview Settings
interview.duration.minutes=30
interview.max.questions=10

# Speech Recognition Settings
speech.timeout.seconds=15
speech.phrase.time.limit.seconds=60
speech.wait.after.seconds=3

# Text-to-Speech Settings
tts.rate=180
tts.volume=0.9

# Logging Settings
logging.level=INFO 
