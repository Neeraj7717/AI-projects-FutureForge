name: unitycatalog

services:
  server:
    build:
      context: .  # Adjust this to the directory with the server's Dockerfile (e.g., ./server if it’s in a subdirectory)
      dockerfile: Dockerfile  # Adjust if the Dockerfile has a different name
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./etc/conf
        target: /opt/unitycatalog/etc/conf
      - type: volume
        source: unitycatalog_data
        target: /opt/unitycatalog/etc/data

  # ui:
  #   build:
  #     context: ui/
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - server

volumes:
  unitycatalog_data: